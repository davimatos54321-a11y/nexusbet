name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Instalar Dependências do Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.36
          
      - name: Inicializar Configuração do Buildozer
        run: |
          buildozer init
          sed -i 's/#p4.fork = 0/p4.fork = auto/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
          
      - name: Construir APK com Buildozer
        run: |
          buildozer -v android debug
          
      - name: Salvar Artefato APK
        uses: actions/upload-artifact@v3
        with:
          name: app-nexusbet
          path: bin/*.apk
